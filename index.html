
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./css/output.css" rel="stylesheet">
    <title>Mon Catalogue</title>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
    <header class="bg-red-600 text-white p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Auchan</h1>
            <input type="search" placeholder="Rechercher un produit..." class="w-40 rounded-lg p-2 text-gray-800 md:w-80">
            <span>Mon compte</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4">
        <h2 class="text-2xl font-bold">Nos produits</h2>
        <p class="mt-2 text-gray-600">Découvrez notre catalogue de produits.</p>
        <section id="produits" class="mt-6 grid grid-cols-2 gap-4 md:grid-cols-4"> </section>
    </main>
    <footer class="mt-8 bg-green-900 p-6 text-white">
        <div class="max-w-6xl mx-auto">
            <h2 class="text-xl font-bold">Auchan</h2>
            <p class="mt-2 text-green-200">Bien plus que des courses</p>
            <p class="mt-4 text-sm">© 2026 Mon Catalogue</p>
        </div>
    </footer>
</body>
</html>
