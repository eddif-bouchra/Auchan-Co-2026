
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./css/output.css" rel="stylesheet">
    <title>Mon Catalogue</title>
</head>

<body class="bg-gray-100">
    <header class="bg-red-600 p-4 text-white flex flex-col gap-3 md:flex-row md:justify-between md:items-center">
            <h1 class="text-2xl font-bold italic"> Auchan</h1>
            <input id="recherche" type="text"  placeholder="Rechercher un produit..." class="w-full md:w-1/3 rounded-full px-5 py-3 text-sm text-gray-800 border border-white bg-white">
    </header>
    <nav class="bg-white p-3 flex gap-3 overflow-x-auto">
        <a href="#" data-categorie="Fruits" class="px-4 py-2 rounded ">Fruits</a>
        <a href="#" data-categorie="Légumes" class="px-4 py-2">Légumes</a>
        <a href="#" data-categorie="Boissons" class="px-4 py-2">Boissons</a>
        <a href="#" data-categorie="Epicerie" class="px-4 py-2">Epicerie</a>
        <a href="#" data-categorie="Hygiéne" class="px-4 py-2">Hygiéne</a>
    </nav>
   
    <main class="max-w-6xl mx-auto p-4 flex flex-col lg:flex-row gap-6">
        
        <section class = "flex-1 min-w-0">
            <h2 id="titre" class="text-3xl font-bold">Fruits</h2>
            <p id="description"class="text-gray-500 mb-4">Des fruits frais et qualité , au mailleur prix</p>
            <div class ="flex gap-2 mb-4">
                <button id ="btnGrille" class="bg-red-500 text-white px-4 py-2 rounded">Grille</button>
                <button id="btnListe" class="bg-gray-300 text-gray-800 px-4 py-2 rounded">Liste</button>
            </div>
            <!-- <div id="tableau" class="hidden overflow-x-auto"></div> -->
            <div id="products"  class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
            <div id = "pagination" class ="flex justify-center gap-2 mt-6"></div>
        </section>
        <aside class="w-full lg:w-1/4 bg-white rounded-xl shadow p-4 h-fit flex flex-col gap-4">
                <h2 class="text-xl font-bold">Mon panier</h2>
            <div class="border-t pt-4">
                <span class="font-semibold">Total : <span class="text-red-600 font-bold">0 MAD</span></span>
                <button type="button" class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700">Voir mon panier</button>
            </div>
        </aside>    
            
       
       
    </main>
    <footer class="mt-8 bg-green-900 p-6 text-white">
        <div class="max-w-6xl mx-auto">
            <h2 class="text-xl font-bold">Auchan</h2>
            <p class="mt-2 text-green-200">Bien plus que des courses</p>
            <p class="mt-4 text-sm">© 2026 Mon Catalogue</p>
        </div>
    </footer>
<script type="module" src="./js/main.js"></script>
</body>

</html>
